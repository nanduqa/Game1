<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <canvas id="gameCanvas" width="1280" height="720" aria-label="Physics playground"></canvas>

      <div id="hud" class="hud hidden">
        <div class="hud-chip"><span>Prop</span><strong id="hudProp"></strong></div>
        <div class="hud-chip"><span>Concept</span><strong id="hudConcept"></strong></div>
        <div class="hud-chip"><span>Activity</span><strong id="hudActivity"></strong></div>
        <div class="hud-chip"><span>Score</span><strong id="hudScore">0</strong></div>
      </div>

      <div id="startScreen" class="screen center-screen">
        <h1>Physics Playground</h1>
        <p>Master gravity, elasticity, oscillation, buoyancy, and friction across 25 challenges.</p>
        <button id="startButton" class="primary-btn">Start Adventure</button>
      </div>

      <div id="activityPanel" class="panel hidden">
        <h2 id="activityTitle"></h2>
        <p id="activityInstruction"></p>
        <div id="activityControls" class="controls"></div>
        <div id="activityActions" class="actions"></div>
        <p id="feedback" class="feedback"></p>
      </div>

      <div id="completionScreen" class="screen center-screen hidden">
        <h2>Great Work, Physicist! ✨</h2>
        <p id="completionScore"></p>
        <p id="completionStars"></p>
        <button id="restartButton" class="primary-btn">Play Again</button>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
